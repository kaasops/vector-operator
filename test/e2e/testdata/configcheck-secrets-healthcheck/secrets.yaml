# Synthetic keys of the S3 mock: "s3-creds" holds the ones it accepts, "s3-creds-wrong"
# keeps the access key but has a wrong secret key, so a healthcheck signed with it fails.
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds
type: Opaque
stringData:
  id: e2e-access-key
  key: e2e-secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-creds-wrong
type: Opaque
stringData:
  id: e2e-access-key
  key: not-the-secret-key

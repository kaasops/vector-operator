# ClusterVectorPipeline exercising cluster-scoped secret semantics: spec.secret
# backends on a CVP require an explicit namespace (resolved via an uncached read), and
# the resulting flat asset key has no namespace segment - it is
# sanitize("<pipelineName>-<alias>-<key>") (see flatKey/generateName("", name) in
# internal/config/secrets.go and internal/config/utils.go). No selector/labels are
# needed: the suite's agent.yaml declares no pipeline selector, so it picks up every
# valid pipeline in the cluster (see k8s.MatchLabels: a nil selector matches all).
apiVersion: observability.kaasops.io/v1alpha1
kind: ClusterVectorPipeline
metadata:
  name: cvp-secrets-e2e
spec:
  secret:
    es:
      type: kubernetes_secret
      name: cvp-creds
      namespace: NAMESPACE
  sources:
    logs:
      type: kubernetes_logs
  sinks:
    out:
      type: elasticsearch
      inputs:
        - logs
      endpoints:
        - "http://elasticsearch.example.com:9200"
      healthcheck:
        enabled: false
      auth:
        strategy: basic
        user: "SECRET[es.username]"
        password: "SECRET[es.password]"

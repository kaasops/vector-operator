# Backing Secret for the ClusterVectorPipeline's "es" backend (cvp-pipeline.yaml).
# Lives in the framework's test namespace; the CVP's spec.secret.es.namespace field
# points here explicitly, since ClusterVectorPipeline secret backends require an
# explicit namespace (resolved via an uncached read - see internal/config/secrets.go).
apiVersion: v1
kind: Secret
metadata:
  name: cvp-creds
type: Opaque
stringData:
  username: "cvp-es-user"
  password: "cvp-es-pass"

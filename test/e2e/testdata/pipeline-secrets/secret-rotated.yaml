# Same Secret as secret.yaml with a rotated username, used to verify the aggregated
# secret-assets Secret and status.relatedSecretsHash pick up the change while the
# agent config Secret itself stays byte-identical.
apiVersion: v1
kind: Secret
metadata:
  name: creds
type: Opaque
stringData:
  username: "es-user-rotated"
  password: "es-pass-initial"
